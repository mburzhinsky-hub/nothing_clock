<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Glyph Clock" />
  <title>Glyph Clock</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app theme-dark" data-style="dot" data-mode="clock" aria-label="Glyph ambient display">
    <div id="ambientWeather" class="ambient-weather" aria-hidden="true"></div>

    <button id="stage" class="stage" type="button" aria-label="Показать настройки">
      <span class="display-shell">
        <svg id="clock" class="clock" viewBox="0 0 710 250" role="img" aria-label="Текущее отображение"></svg>
        <canvas id="dreamCanvas" class="dream-canvas" aria-hidden="true"></canvas>
        <span id="modeMeta" class="mode-meta" aria-live="polite"></span>
      </span>
    </button>

    <section id="launcherGrid" class="launcher-grid" aria-label="Быстрый доступ"></section>

    <section id="launcherEditor" class="launcher-editor" aria-label="Редактирование ярлыка" hidden>
      <div class="launcher-editor-card">
        <div class="launcher-editor-title">QUICK ACCESS</div>
        <label>
          <span>NAME</span>
          <input id="launcherLabel" type="text" maxlength="16" autocomplete="off" />
        </label>
        <label>
          <span>URL / APP SCHEME</span>
          <input id="launcherUrl" type="text" maxlength="240" inputmode="url" autocomplete="off" />
        </label>
        <div class="launcher-editor-actions">
          <button id="launcherCancel" type="button">CANCEL</button>
          <button id="launcherSave" class="primary" type="button">SAVE</button>
        </div>
      </div>
    </section>

    <nav id="modeRail" class="mode-rail" aria-label="Режим">
      <button type="button" data-mode-choice="clock" aria-label="Clock"></button>
      <button type="button" data-mode-choice="date" aria-label="Date"></button>
      <button type="button" data-mode-choice="weather" aria-label="Weather"></button>
      <button type="button" data-mode-choice="timer" aria-label="Timer"></button>
      <button type="button" data-mode-choice="focus" aria-label="Focus"></button>
      <button type="button" data-mode-choice="launcher" aria-label="Launcher"></button>
      <button type="button" data-mode-choice="dream" aria-label="Dream"></button>
    </nav>

    <section id="modeActions" class="mode-actions" aria-label="Управление режимом"></section>

    <section id="controls" class="controls" aria-label="Настройки отображения">
      <div class="style-switcher" role="group" aria-label="Стиль глифов">
        <button class="chip active" data-style-choice="dot" type="button" aria-pressed="true"><span class="chip-icon dot-icon" aria-hidden="true">•••</span><span>Dots</span></button>
        <button class="chip" data-style-choice="segment" type="button" aria-pressed="false"><span class="chip-icon segment-icon" aria-hidden="true">88</span><span>Segment</span></button>
        <button class="chip" data-style-choice="hybrid" type="button" aria-pressed="false"><span class="chip-icon hybrid-icon" aria-hidden="true">◌◍</span><span>Hybrid</span></button>
        <button class="chip" data-style-choice="wire" type="button" aria-pressed="false"><span class="chip-icon wire-icon" aria-hidden="true">⌁</span><span>Wire</span></button>
        <button class="chip" data-style-choice="stencil" type="button" aria-pressed="false"><span class="chip-icon stencil-icon" aria-hidden="true">▣</span><span>Stencil</span></button>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Сменить тему"><span class="theme-dot" aria-hidden="true"></span></button>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
