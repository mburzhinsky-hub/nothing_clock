<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Glyph Clock" />
  <title>Glyph Clock</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app theme-dark" data-style="dot" aria-label="Часы">
    <button id="stage" class="stage" type="button" aria-label="Показать настройки">
      <svg id="clock" class="clock" viewBox="0 0 1000 280" role="img" aria-label="Текущее время"></svg>
    </button>

    <section id="controls" class="controls" aria-label="Настройки часов">
      <div class="style-switcher" role="group" aria-label="Стиль глифов">
        <button class="chip active" data-style-choice="dot" type="button" aria-pressed="true">
          <span class="chip-icon dot-icon" aria-hidden="true">•••</span>
          <span>Dots</span>
        </button>
        <button class="chip" data-style-choice="segment" type="button" aria-pressed="false">
          <span class="chip-icon segment-icon" aria-hidden="true">88</span>
          <span>Segment</span>
        </button>
        <button class="chip" data-style-choice="hybrid" type="button" aria-pressed="false">
          <span class="chip-icon hybrid-icon" aria-hidden="true">◌◍</span>
          <span>Hybrid</span>
        </button>
      </div>

      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Сменить тему">
        <span class="theme-dot" aria-hidden="true"></span>
      </button>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
